<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot or Not — Leaderboard</title>
  <meta name="description" content="Live leaderboard for the Bot or Not game.">
  <link rel="canonical" href="https://botornot-5059e.web.app/leaderboard.html">
  <meta property="og:title" content="Bot or Not — Global Leaderboard">
  <meta property="og:url" content="https://botornot-5059e.web.app/leaderboard.html">
  <link rel="stylesheet" href="/style.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BHYL3QXKLB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-BHYL3QXKLB');
  </script>

    <!-- Google Ads -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6191036662709209"
    crossorigin="anonymous"></script>

</head>
<body>
  <header class="site-navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-brand">Bot or Not</a>
      <nav>
        <ul class="navbar-nav">
          <li><a href="/" class="nav-link">Play</a></li>
          <li><a href="/leaderboard.html" class="nav-link active">Leaderboard</a></li>
          <li><a href="/contact.html" class="nav-link">Contact</a></li>
          <li><a href="https://prajwal-56.github.io/donate" target="_blank" rel="noopener noreferrer" class="nav-link nav-link-donate">Donate</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="page" style="justify-content:flex-start; padding-top:2rem; min-height: calc(100vh - 120px);">
    <div class="container">
      <div class="text-center" style="margin-bottom:1.5rem">
        <div class="site-title">Leaderboard</div>
        <p class="subtitle">Ranked by points</p>
      </div>

      <div class="card" style="padding:0">
        <div style="overflow-x:auto">
          <table id="board-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Name</th>
                <th>Points</th>
                <th>Correct</th>
                <th>Answered</th>
              </tr>
            </thead>
            <tbody id="board-body">
              <tr><td colspan="5" class="muted text-center" style="padding:2rem">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="text-center mt-2">
        <span id="last-updated" class="muted"></span>
        &nbsp;
        <button id="refresh-btn" class="btn btn-secondary" onclick="resetAndLoad()">Refresh</button>
        <a href="/" class="btn btn-secondary" style="margin-left:0.5rem">Home</a>
      </div>

      <div class="text-center" style="margin-top:1rem" id="load-more-wrap" hidden>
        <button id="load-more-btn" class="btn btn-secondary" onclick="loadMore()">Load more</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    made by <a href="https://prajwal-56.github.io/neobrutal" target="_blank" rel="noopener noreferrer" class="unhighlighted-link">P</a>
  </footer>

  <script src="/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/game-engine.js"></script>
  <script>
    const tbody        = document.getElementById('board-body');
    const lastUpd      = document.getElementById('last-updated');
    const loadMoreWrap = document.getElementById('load-more-wrap');
    const loadMoreBtn  = document.getElementById('load-more-btn');

    const PAGE_SIZE = 36;
    let lastCursor  = null;   // Firestore doc snapshot for startAfter()
    let globalRank  = 0;      // running rank counter across pages

    function esc(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function rowHtml(row, rank) {
      const rankClass = rank <= 3 ? `rank-${rank}` : '';
      return `<tr class="${rankClass}">
        <td>${rank}</td>
        <td>${esc(row.username)}</td>
        <td><strong>${row.points} pts</strong></td>
        <td>${row.correctCount}</td>
        <td>${row.totalAnswered}</td>
      </tr>`;
    }

    async function loadMore() {
      loadMoreBtn.disabled = true;
      loadMoreBtn.textContent = 'Loading...';
      try {
        const rows = await window.GameEngine.getLeaderboard(lastCursor, PAGE_SIZE);

        if (!rows || rows.length === 0) {
          loadMoreWrap.hidden = true;
          return;
        }

        // Remove the "no results" placeholder if present
        const placeholder = tbody.querySelector('tr[data-placeholder]');
        if (placeholder) placeholder.remove();

        rows.forEach(row => {
          globalRank++;
          tbody.insertAdjacentHTML('beforeend', rowHtml(row, globalRank));
        });

        // Save the last Firestore snapshot for the next page cursor
        lastCursor = rows[rows.length - 1]._snap || { _localIndex: globalRank };

        // Hide "Load more" if we got fewer than a full page (no more data)
        loadMoreWrap.hidden = rows.length < PAGE_SIZE;
        lastUpd.textContent = 'Updated ' + new Date().toLocaleTimeString();
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="5" class="muted text-center">Failed to load leaderboard.</td></tr>';
      } finally {
        loadMoreBtn.disabled = false;
        loadMoreBtn.textContent = 'Load more';
      }
    }

    async function resetAndLoad() {
      // Clear table, reset state, reload from top
      lastCursor  = null;
      globalRank  = 0;
      loadMoreWrap.hidden = true;
      tbody.innerHTML = '<tr data-placeholder><td colspan="5" class="muted text-center" style="padding:2rem">Loading...</td></tr>';
      await loadMore();
    }

    resetAndLoad();
  </script>
</body>
</html>
